{% extends "base.html" %}

{% block title %}My Courses | Group Allocation{% endblock %}

{% block content %}
    <main class="courses-panel">
        <h1>My Courses</h1>
        <ul class="course-list">
            {% for course in courses %}
                <li><strong>{{ course.course_id }}</strong> — {{ course.title }}</li>
            {% empty %}
                <li>You’re not enrolled in any courses yet.</li>
            {% endfor %}
        </ul>
    </main>
{% endblock %}
